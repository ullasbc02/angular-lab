<!-- tasks.component.html -->
<h2>Tasks</h2>
<button (click)="openCreateForm()">+ New Task</button>

<app-task-form
  *ngIf="showForm"
  [task]="editingTask"
  (saved)="onFormSaved()"
  (cancelled)="onFormCancelled()">
</app-task-form>

<input
  [formControl]="searchControl"
  placeholder="Search tasks..."
  class="search-input">

<ng-container *ngIf="tasks$ | async as tasks; else loadingBlock">
  <ul class="task-list">
    <li *ngFor="let task of tasks; trackBy: trackById" class="task-item" (click)="openEditForm(task)">
      <span class="task-title">{{ task.title }}</span>
      <span class="status-badge" [ngClass]="task.status">{{ task.status }}</span>
    </li>
  </ul>

  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
</ng-container>

<ng-template #loadingBlock>
  <div class="loading">Loading tasks...</div>
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
</ng-template>
