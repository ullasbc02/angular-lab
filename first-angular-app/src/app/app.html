<app-header></app-header>
<main>
  <ul id="users">
    @for (user of users; track user.id) {
      <li><app-user (userSelected)="onSelectUser($event)" [user]="user" [selected]="user.id === selectedUserId" /></li>
    }
  </ul>
  @if(selectedUser){
    <app-tasks [userId]="selectedUser.id" [name]="selectedUser.name" />
  }@else {
    <p>No user selected</p>
  }
</main>
